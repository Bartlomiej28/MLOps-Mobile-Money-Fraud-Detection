grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 5
    verbose: 1
    n_jobs: -1
    scoring: roc_auc

model_selection:
  module_0:
    class: HistGradientBoostingClassifier
    module: sklearn.ensemble
    params:
      class_weight: balanced
      max_iter: 300
      learning_rate: 0.03
      early_stopping: false
      random_state: 42
    search_param_grid:
      learning_rate:
      - 0.02
      - 0.05
      max_leaf_nodes:
      - 7
      - 15
      - 31
      min_samples_leaf:
      - 50
      - 200
      l2_regularization:
      - 5.0

  module_1:
    class: LogisticRegression
    module: sklearn.linear_model
    params:
      class_weight: balanced
      max_iter: 2000
      random_state: 42
    search_param_grid:
      C:
      - 0.01
      - 0.1
      - 1.0
      - 10.0

  module_2:
    class: ExtraTreesClassifier
    module: sklearn.ensemble
    params:
      class_weight: balanced_subsample
      n_estimators: 200
      max_features: sqrt
      n_jobs: 1
      random_state: 42
    search_param_grid:
      max_depth:
      - 6
      - 10
      - null
      min_samples_leaf:
      - 20
      - 50
      - 100
